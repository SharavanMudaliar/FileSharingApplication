<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{login.title}">Login - File Sharing App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app-theme.css">
    <style>
        .login-box { background: #fff; border-radius: 8px; margin-top:80px; padding: 32px; box-shadow: 0 2px 16px #ddd; }
        .brand-logo { width:90px; margin-bottom:10px; border-radius:25%; box-shadow:0 1px 7px #bbb;}
        .btn-google { background-color: #ea4335; color: #fff; border: none; }
        .btn-github { background-color: #24292f; color: #fff; border: none; }
        .btn-google:hover, .btn-github:hover { opacity: 0.90; color: #fff; }
        .login-title { font-weight: 600; letter-spacing: 1px; margin-bottom: 12px; font-size:2rem; color: #24292f;}
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="login-box text-center">

        <!-- Show logout message if coming from logout -->
        <div th:if="${param.logout}" class="alert alert-success mb-3">
            You have been logged out successfully.
        </div>

        <img src="/img/logo.png" alt="App Logo" class="brand-logo mb-2">

        <div class="login-title" th:text="#{login.heading}">Welcome to Sharavan's File Sharing</div>
        <p th:text="#{login.desc}">Upload, store and share files securely. Choose your provider:</p>
        <a class="btn btn-google btn-lg m-2" href="/oauth2/authorization/google">
            <span th:text="#{login.google}">Sign in with Google</span>
        </a>
        <a class="btn btn-github btn-lg m-2" href="/oauth2/authorization/github">
            <span th:text="#{login.github}">Sign in with GitHub</span>
        </a>
        <div class="mt-3 small text-muted">
            <span th:text="#{login.terms}">By signing in, you agree to our <a href="#">Terms &amp; Privacy</a>.</span>
        </div>
    </div>
</div>
</body>
</html>
