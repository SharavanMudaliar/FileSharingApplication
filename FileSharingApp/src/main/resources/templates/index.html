<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{fileshare.title}">Spring Boot File Share (Timed Links)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link id="themeStylesheet" rel="stylesheet" th:href="@{/css/app-theme-light.css}">
    <script>
        const themeKey = "fileshare-theme";
        function setTheme(theme) {
            document.getElementById("themeStylesheet").href = "/css/app-theme-" + theme + ".css";
            localStorage.setItem(themeKey, theme);
        }
        window.addEventListener('DOMContentLoaded', () => {
            let theme = localStorage.getItem(themeKey) || "light";
            setTheme(theme);
            document.getElementById("themeToggle").onclick = function() {
                let thm = localStorage.getItem(themeKey) === "dark" ? "light" : "dark";
                setTheme(thm);
            }
        });
    </script>
    <style>
        .main-box { background: #fff; border-radius: 8px; margin-top: 32px; padding: 32px; box-shadow: 0 2px 12px #ddd; }
        .brand-title { font-size: 1.5rem; color: #43506b; margin: 6px 0 4px 0 }
        .brand-sub { margin-bottom: 16px; }
        .share-link { width:90%; }
        .copy-btn{ min-width: 80px;}
        .table{margin-top:24px;}
        .expired { color: #a00; font-weight: bold; }
    </style>
</head>
<body>
<div class="container main-box">

    <!-- Logout message after redirect (optional, can be removed if not using logout banner) -->
    <div th:if="${param.logout}" class="alert alert-success">
        You have been logged out successfully.
    </div>

    <!-- Theme switcher -->
    <div class="text-right mb-2">
        <button class="btn btn-sm btn-outline-secondary" id="themeToggle" title="Switch dark/light mode">
            🌙/☀️ Switch Theme
        </button>
    </div>

    <div class="text-center mb-2">
        <img src="/img/logo.png" alt="Logo" style="width:72px;height:72px;border-radius:16px;box-shadow:0 2px 10px #ddd;">
        <div class="brand-title font-weight-bold" th:text="#{fileshare.brand-title}">Sharavan's File Sharing Portal</div>
        <div class="brand-sub text-muted small" th:text="#{fileshare.brand-sub}">Upload, store and share files with expiring links.</div>
    </div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${#messages.msgOrNull(error) != null} ? #{${error}} : ${error}"></div>
    <div th:if="${success}" class="alert alert-success"
         th:text="${#messages.msgOrNull(success) != null} ? #{${success}} : ${success}"></div>

    <div th:if="${username}" class="mb-3">
        <span th:text="#{logged.in.as}">Logged in as</span>
        <span th:text="${username}"></span> |
        <a th:href="${logoutUrl}" class="font-weight-bold text-danger" th:text="#{logout}">Logout</a>
    </div>

    <h2 class="mb-4" th:text="#{upload.button}">Upload a file</h2>
    <form action="/upload" method="post" enctype="multipart/form-data" class="form-inline mb-4">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="file" name="file" required class="form-control mr-2">
        <input type="number" name="expiry" min="1" max="1440"
               th:placeholder="#{upload.placeholder}" class="form-control mr-2">
        <button type="submit" class="btn btn-success" th:text="#{upload.button}">Upload</button>
    </form>

    <h4 class="mt-4" th:text="#{available.files}">Available Files</h4>
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th th:text="#{file.name}">Name</th>
            <th th:text="#{file.expiryleft}">Expiry Left</th>
            <th th:text="#{file.status}">Status</th>
            <th th:text="#{file.sharelink}">Share Link</th>
            <th th:text="#{file.download}">Download</th>
            <th th:text="#{file.copylink}">Copy Link</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="file : ${files}" th:classappend="${file.status == 'Expired' ? 'expired' : ''}">
            <td th:text="${file.name}"></td>
            <td th:text="${file.expiry}"></td>
            <td th:text="${file.status}"></td>
            <td>
                <input class="form-control share-link" th:value="${file.link}" readonly>
            </td>
            <td>
                <a th:href="${file.link}" class="btn btn-primary btn-sm"
                   th:if="${file.status == 'Active'}" target="_blank" th:text="#{file.download}">Download</a>
                <button class="btn btn-secondary btn-sm" disabled th:if="${file.status == 'Expired'}"
                        th:text="#{file.expired}">Expired</button>
            </td>
            <td>
                <button class="btn btn-outline-secondary btn-sm copy-btn"
                        th:attr="data-link=${file.link}"
                        onclick="navigator.clipboard.writeText(this.getAttribute('data-link'));" th:text="#{file.copylink}">Copy</button>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="mt-3 text-muted" th:text="#{file.expiry.disclaimer}">Share links expire automatically as per set time.</div>
</div>
</body>
</html>
